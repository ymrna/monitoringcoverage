<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Monitoring Coverage</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), 
                        url('/static/bg-login.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
            width: 320px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-align: center;
        }
        .header-title {
            font-size: 1.8em;
            font-weight: bold;
            margin: 0 0 6px 0;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .header-subtitle {
            font-size: 0.9em;
            color: #aaaaaa;
            margin: 0 0 25px 0;
            font-weight: normal;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: #ddd;
        }
        .form-group input {
            width: 100%;
            padding: 11px 12px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            background-color: rgba(0, 0, 0, 0.5);
            color: #fff;
            outline: none;
        }
        .form-group input:focus {
            border-color: #007bff;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .btn-login:hover {
            background-color: #0056b3;
        }
        .error-msg {
            color: #ff6b6b;
            font-size: 0.85em;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="header-title">📡 Monitoring Coverage</div>
    <div class="header-subtitle">Tim Montib Balmon Pangkalpinang</div>

    {% if error %}
        <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form action="/login" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="off">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn-login">Masuk</button>
    </form>
</div>

</body>
</html>
